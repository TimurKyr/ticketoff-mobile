name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Deprecation notices (info) are reported but do not fail the build; warnings and errors do.
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test
